<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Čtečka</title>
<meta name="theme-color" content="#f5f1e8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141310" media="(prefers-color-scheme: dark)">
<script>/* téma a e-ink hned, ať polička neblikne světle, když je zvolený tmavý režim */
try { var v = JSON.parse(localStorage.getItem('ctecka:volby') || '{}'); if (v.tema) document.documentElement.setAttribute('data-theme', v.tema); if (v.eink) document.documentElement.setAttribute('data-eink', ''); } catch (e) {}</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="ikona.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="ikona-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..600&family=IBM+Plex+Sans+Condensed:wght@400;500&display=swap">
<style>
:root{
  --bg:#f5f1e8; --paper:#fbf8f1; --ink:#1f1c17; --ink2:#5f574b; --rule:#d9cfbd; --soft:#ebe4d6;
  --acc:#c2492f; --acc2:#2f6f8f; --shadow:rgba(31,28,23,.12);
  --display:"Fraunces","Iowan Old Style",Georgia,serif; --body:"Source Serif 4",Georgia,serif;
  --label:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141310; --paper:#1b1a16; --ink:#ece5d6; --ink2:#a99f8d; --rule:#3a352c; --soft:#25231e;
  --acc:#ef7a5c; --acc2:#6fb3d4; --shadow:rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141310; --paper:#1b1a16; --ink:#ece5d6; --ink2:#a99f8d; --rule:#3a352c; --soft:#25231e;
  --acc:#ef7a5c; --acc2:#6fb3d4; --shadow:rgba(0,0,0,.4); color-scheme:dark}
/* e-ink (Boox): černobílé, bez stínů a přechodů */
:root[data-eink]{--bg:#fff; --paper:#fff; --ink:#000; --ink2:#333; --rule:#000; --soft:#fff; --acc:#000; --acc2:#000; --shadow:transparent; color-scheme:light}
:root[data-eink] *{transition:none!important;animation:none!important}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:18px/1.55 var(--body);-webkit-text-size-adjust:100%}
button{font:500 15px var(--label);color:var(--ink);background:var(--soft);border:1px solid var(--rule);border-radius:999px;padding:8px 14px;min-height:40px;cursor:pointer}
button.hlavni{background:var(--ink);color:var(--paper);border-color:var(--ink)}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* ---- domov ---- */
#domov{max-width:44rem;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 64px max(16px,env(safe-area-inset-left))}
.lista{display:flex;align-items:center;justify-content:space-between;gap:12px;font:500 13px var(--label);letter-spacing:.16em;text-transform:uppercase;color:var(--ink2)}
.lista .ovl{display:flex;gap:6px}
.lista button{min-height:36px;padding:6px 12px;letter-spacing:0;text-transform:none}
h1{font:400 clamp(30px,7vw,40px)/1.05 var(--display);letter-spacing:-.02em;margin:16px 0 2px}
h1 em{color:var(--acc)}
.datum{color:var(--ink2);font-style:italic;margin:0 0 14px;font-size:16px}
.karticka{margin:6px 0 0;border:1px dashed var(--rule);border-radius:10px;background:var(--paper)}
.karticka summary{cursor:pointer;list-style:none;padding:14px 16px;font:20px/1.3 var(--display)}
.karticka summary::-webkit-details-marker{display:none}
.karticka summary::before{content:"Kartička z minula · zkus si odpovědět";display:block;font:500 12px var(--label);letter-spacing:.14em;text-transform:uppercase;color:var(--acc2);margin-bottom:6px}
.karticka div{padding:0 16px 14px;color:var(--ink2)}
section.regal h3{display:flex;justify-content:space-between;align-items:baseline;font:500 13px var(--label);letter-spacing:.18em;text-transform:uppercase;color:var(--acc);margin:26px 0 4px}
section.regal h3 a{color:var(--ink2);text-decoration:none;letter-spacing:.06em;text-transform:none;font-size:14px}
.zpet{display:inline-block;margin-top:14px;font:15px var(--label);color:var(--ink2);text-decoration:none}
.regal li{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;border-top:1px solid var(--rule)}
.kos{min-height:40px;padding:4px 10px;background:none;border:0;opacity:.45;font-size:17px}
.kos:hover,.kos:focus-visible{opacity:1}
.regal ul{list-style:none;margin:0;padding:0}
.regal li a{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1px 12px;padding:10px 0;color:inherit;text-decoration:none}
.regal li b{font:500 19px/1.2 var(--display)}
.regal li span{grid-column:1;font-size:14.5px;color:var(--ink2);line-height:1.3}
.regal li i{grid-row:1/span 2;grid-column:2;align-self:center;font:13px var(--label);font-style:normal;color:var(--ink2);text-align:right;white-space:nowrap}
.regal li.precteno b::after{content:" ✓";color:var(--acc2);font-size:.8em}
.stav{font:14px var(--label);color:var(--ink2);margin-top:28px;min-height:1.4em}
.prazdno{border:1px dashed var(--rule);border-radius:10px;padding:18px;color:var(--ink2)}
dialog{border:1px solid var(--rule);border-radius:12px;background:var(--paper);color:var(--ink);max-width:min(30rem,calc(100vw - 32px));padding:18px 20px}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog h2{font:500 26px var(--display);margin:0 0 10px}
dialog label{display:flex;gap:10px;align-items:center;margin:10px 0;font:16px var(--label)}
dialog .rada{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
dialog p{font-size:15px;color:var(--ink2)}

/* ---- ＋ zadání (zadani.js) ---- */
.zad h2{font:400 28px/1.15 var(--display);margin:14px 0 12px}
.zad h3{font:500 13px var(--label);letter-spacing:.18em;text-transform:uppercase;color:var(--acc);margin:22px 0 8px}
.zad h4{font:500 15px var(--label);margin:18px 0 6px}
.zad i{font-style:normal;color:var(--ink2);font-weight:400}
.z-pole{display:block;margin:12px 0}
.z-pole span{display:block;font:500 15px var(--label);margin-bottom:4px}
.zad textarea,.zad input,.zad select{width:100%;font:15.5px/1.4 var(--body);color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:9px 11px}
.zad textarea{resize:vertical}
.z-dlazdice{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.z-dlazdice .dl{display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:12px;padding:10px 6px;min-height:72px;background:var(--paper)}
.z-dlazdice .dl b{font-size:22px;line-height:1}
.z-dlazdice .dl span{font:14px/1.2 var(--label);text-align:center}
.zad [aria-pressed=true]{border:2px solid var(--ink);font-weight:600;background:var(--soft)}
.z-doladit{margin-top:16px;border:1px solid var(--rule);border-radius:12px;padding:4px 14px 14px;background:var(--paper)}
.z-doladit>summary{cursor:pointer;padding:10px 0;font:500 16px var(--label)}
.z-param{margin:10px 0}
.z-nazev{display:block;font:500 14px var(--label);color:var(--ink2);margin-bottom:4px}
.z-seg,.z-cipy{display:flex;flex-wrap:wrap;gap:6px}
.z-seg button,.z-cipy button{min-height:36px;padding:5px 12px;font-size:14px;background:transparent}
.z-cipy [data-stav=ano]{border:2px solid var(--ink);font-weight:600}
.z-cipy [data-stav=ano]::after{content:" ✓"}
.z-cipy [data-stav=ne]{text-decoration:line-through;color:var(--ink2)}
.z-rozsah{display:flex;gap:8px}.z-rozsah input{max-width:7rem}
.z-slider{display:grid;grid-template-columns:7.5rem minmax(0,1fr) 3.4rem 2.2rem;align-items:center;gap:8px;margin:6px 0}
.z-slider .z-nazev{margin:0;color:var(--ink)}
.z-slider.maly .z-nazev{font-size:13px;color:var(--ink2)}
.z-slider input{padding:0;border:0;background:none;accent-color:var(--ink)}
.z-slider.auto input{opacity:.35}
.z-slider output{font:14px var(--label);text-align:right;color:var(--ink2)}
.z-reset{min-height:30px;padding:0 6px;background:none}
.z-skupina details{margin:0 0 8px 12px}
.z-skupina summary{cursor:pointer;font:13px var(--label);color:var(--ink2)}
.z-preset-uloz{display:flex;gap:8px;margin-top:16px}
.z-rada{display:flex;gap:8px;flex-wrap:wrap}.z-rada select{flex:1 1 12rem}.z-rada input{flex:1 1 8rem}
.z-akce{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.z-pozn,.z-stav{font:14px var(--label);color:var(--ink2)}
.z-zprava{border-left:3px solid var(--acc2);padding-left:10px}
.z-otazka{border-top:1px solid var(--rule);padding-top:8px;margin-top:10px}
.z-otazka p{margin:0 0 8px}
.z-otazka textarea{margin-top:8px}
.z-osn-lista{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0 6px}
.z-osn-lista span{font:14px var(--label);color:var(--ink2);margin-right:4px}
.z-osn-lista button{min-height:32px;padding:3px 10px;font-size:13px;background:transparent}
.z-casti{list-style:none;margin:0;padding:0;counter-reset:cast}
.z-cast{border-top:1px solid var(--rule);padding:8px 0;counter-increment:cast}
.z-cast.vyp .z-cast-hlava b{color:var(--ink2);text-decoration:line-through}
.z-cast-hlava{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;cursor:pointer}
.z-cast-hlava input{width:22px;height:22px;margin:0;accent-color:var(--ink)}
.z-cast-hlava b{font:500 15.5px var(--label)}
.z-cast-hlava b::before{content:counter(cast) ". ";color:var(--ink2);font-weight:400}
.z-cast-hlava i{font:12px var(--label);color:var(--ink2)}
.z-hk{display:grid;grid-template-columns:7.5rem minmax(0,1fr) auto;gap:8px;align-items:center;margin:6px 0 0 30px}
.z-hk>span{font:13px var(--label);color:var(--ink2)}
.z-hk input[type=range]{padding:0;border:0;background:none;accent-color:var(--ink)}
.z-hk output{font:14px var(--label);min-width:2rem;text-align:right}
.z-hk .z-seg,.z-hk .z-cipy{grid-column:2/4;gap:5px}
.z-hk .z-seg button,.z-hk .z-cipy button{min-height:32px;padding:3px 10px;font-size:13px}
.z-otazky{margin:6px 0 0 30px}
.z-otazky summary{cursor:pointer;font:13px var(--label);color:var(--ink2)}
.z-otazky p{font-size:14px;color:var(--ink2);margin:4px 0}
/* ---- řady a čtení napříč (rady.js) ---- */
.napric-btn{display:inline-block;font:500 15px var(--label);color:var(--ink);border:1px solid var(--rule);border-radius:999px;padding:8px 14px;text-decoration:none;background:var(--soft)}
.napric h4{font:500 15px var(--label);margin:18px 0 4px}
.napric-jadra li a{grid-template-columns:minmax(0,1fr) auto}
.napric-jadra li span{font-size:15.5px;line-height:1.45;color:var(--ink)}

</style>
</head>
<body>
<main id="domov">
  <div class="lista"><span>Čtečka</span><span class="ovl"><button id="b-zadani" title="Nové zadání nebo nápad">＋ zadání</button><button id="b-sync" title="Stáhnout novinky">↻ obnovit</button><button id="b-tema" title="Světlý / tmavý režim" aria-label="Světlý / tmavý režim">☾</button><button id="b-nast" title="Nastavení">⚙</button></span></div>
  <h1>Ráno <em>pro Boba</em></h1>
  <p class="datum" id="datum"></p>
  <div id="obsah"></div>
  <p class="stav" id="stav" aria-live="polite"></p>
</main>

<dialog id="nastaveni">
  <h2>Nastavení</h2>
  <label><input type="checkbox" id="n-eink"> E-ink režim (Boox): bez animací, černobíle</label>
  <label>Vzhled <select id="n-tema"><option value="">podle systému</option><option value="light">světlý</option><option value="dark">tmavý</option></select></label>
  <p id="n-dropbox"></p>
  <div class="rada"><button id="n-pripojit" class="hlavni">Připojit Dropbox</button><button id="n-odpojit">Odpojit</button><button id="n-zavrit">Zavřít</button></div>
</dialog>

<script src="nastaveni.js"></script>
<script src="zadani.js"></script>
<script src="rady.js"></script>
<script src="app.js"></script>
</body>
</html>
